source: https://www.xwing.com/_api/mcp
discovered_via: https://www.xwing.com/llms.txt
summary: >-
  www.xwing.com serves a live, unauthenticated Model Context Protocol endpoint at
  /_api/mcp. It is REAL and it answers — initialize and tools/list both returned HTTP 200
  anonymously on 2026-09-04 — but it is PLATFORM-AUTHORED, not an Xwing engineering
  product. The site runs on Wix, and Wix serves this "Site Visitor Assistant" endpoint
  (and the matching llms.txt) for every site on the platform. The nine tools are Wix
  platform tools for reading site content and calling the Wix REST API on a visitor's
  behalf; none of them exposes Xwing's own autonomy technology, flight data, or any
  Xwing-built API. Recorded because it is genuinely reachable by an agent, and labeled
  so no reader mistakes it for a first-party developer surface.
authorship: platform
authorship_note: >-
  serverInfo.name is 'Site Visitor Assistant for site "Xwing"
  (https://www.xwing.com/_api/mcp)'. The tool set is identical Wix boilerplate across
  Wix-hosted sites; Xwing did not author or configure it.
deployment:
  mode: remote
  endpoint: https://www.xwing.com/_api/mcp
  auth: none
  verified: probed
server:
  name: Site Visitor Assistant for site "Xwing"
  version: 1.0.0
  transport: streamable-http
  protocol_version: '2025-06-18'
  capabilities:
    tools:
      listChanged: true
    logging: {}
  platform: Wix Site MCP
  platform_docs: https://dev.wix.com/docs/develop-websites/articles/get-started/about-the-wix-site-mcp
auth:
  methods:
  - none
  note: >-
    No authorization challenge is returned. /.well-known/oauth-authorization-server and
    /.well-known/oauth-protected-resource both return HTTP 400 on this host (see
    well-known/xwing-well-known.yml), so there is no discovery document behind it.
    Visitor-scoped Wix API calls use a token minted by the GenerateVisitorToken tool.
tool_count: 9
tools_source: mcp/xwing-mcp-tools.json
tools:
- name: GetBusinessDetails
  category: site-data
  parameters: []
  description: Returns business and site details for the Xwing site (timezone, email, phone, address).
- name: SearchInSite
  category: site-data
  parameters:
  - searchTerm
  description: Full-text search of the public www.xwing.com site content.
- name: SearchSiteApiDocs
  category: docs
  parameters:
  - searchTerm
  description: Searches the Wix business-solution API documentation installed on this site.
- name: GenerateVisitorToken
  category: auth
  parameters: []
  description: Mints an anonymous visitor access token, required before CallWixSiteAPI.
- name: CallWixSiteAPI
  category: action
  parameters:
  - visitorToken
  - url
  - method
  - body
  description: Calls a Wix REST API method against this site on a visitor's behalf.
- name: ExecuteWixAPI
  category: action
  parameters:
  - code
  - reason
  - hasMutations
  - sourceDocUrls
  - visitorToken
  description: Runs JavaScript against the Wix REST API on this site on a visitor's behalf.
- name: ReadFullDocsArticle
  category: docs
  parameters:
  - articleUrl
  description: Fetches a full article from the Wix developer documentation portal.
- name: ReadFullDocsMethodSchema
  category: docs
  parameters:
  - articleUrl
  - reason
  description: Fetches the full request/response schema for a Wix API method.
- name: BrowseWixRESTDocsMenu
  category: docs
  parameters:
  - menuUrl
  - reason
  description: Browses the Wix REST API documentation menu hierarchy.
crosswalk: none
crosswalk_reason: >-
  No tool crosswalk is emitted. A crosswalk binds MCP tools to backing OpenAPI
  operationIds, and Xwing publishes no OpenAPI (see x-coverage in apis.yml). The tools
  here back onto the Wix platform REST API, which belongs to Wix, not to Xwing.
