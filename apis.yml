aid: xwing
name: Xwing
description: >-
  Xwing, Inc. is a San Francisco and Concord, California aviation company founded in 2016
  that built Superpilot, a modular retrofit autonomy system enabling ground-supervised,
  uncrewed gate-to-gate flight on conventional fixed-wing aircraft. Flying a Cessna 208B
  Grand Caravan testbed, Xwing completed more than 250 fully autonomous flights and over
  500 auto-landings, and in April 2023 became the first company to receive an FAA project
  designation toward certification of a large unmanned aircraft system. Joby Aviation
  acquired Xwing's autonomy division in June 2024; Xwing retained its Part 135 air cargo
  operation, and www.xwing.com is now an archived marketing site pointing visitors to
  Joby. Xwing never published a developer program, public API, SDK or machine-readable
  contract; the domain's only agent-readable surfaces are the llms.txt and Site MCP
  endpoint that Wix generates for every site it hosts.
